name: Build installers
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - run: npm test
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: trench-war-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
  asset-manager:
    # 서버 없이 더블클릭으로 여는 에셋 매니저 (단일 HTML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build.js
      - run: node tools/build-editor.js
      - uses: actions/upload-artifact@v4
        with:
          name: asset-manager
          path: dist/asset-manager.html
